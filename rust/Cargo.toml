[package]
name = "rust_lib_yl_chat"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
gethostname = "1.1.0"
mdns-sd = "0.21.4"
tokio = { version = "1.53.1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
